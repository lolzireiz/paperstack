<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paperstack</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paperstack">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  /* Brokerage-app layout: iOS system type, white cards on cool grey, dark primary buttons, gain/loss kept semantic. One screen, bottom tab bar, pushed detail pages. */
  --bg:#f2f3f5; --surface:#ffffff; --ink:#15181c; --muted:#686f7a; --line:#e3e6ea; --link:#1d5fc4;
  --btn:#15181c; --btn-ink:#ffffff; --soft:#eef0f3;
  --up:#0b8a3a; --up-bg:#e3f4e8; --down:#c4282c; --down-bg:#fbe7e7; --warn:#9a5b00; --warn-bg:#fdf1de;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#15171a; --ink:#f1f3f5; --muted:#99a0aa; --line:#2a2e34; --link:#6ea4ff;
    --btn:#f1f3f5; --btn-ink:#000000; --soft:#22262b;
    --up:#34c76a; --up-bg:#0f2a19; --down:#ff6461; --down-bg:#331414; --warn:#f2b14b; --warn-bg:#33240f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#15171a; --ink:#f1f3f5; --muted:#99a0aa; --line:#2a2e34; --link:#6ea4ff;
  --btn:#f1f3f5; --btn-ink:#000000; --soft:#22262b;
  --up:#34c76a; --up-bg:#0f2a19; --down:#ff6461; --down-bg:#331414; --warn:#f2b14b; --warn-bg:#33240f;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:600px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 90px)}
.app.page{padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
.px{padding-left:16px;padding-right:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px 4px}
.brandline{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.brandline b{color:var(--ink)}
.bigtitle{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0 10px}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--soft)}
.iconbtn svg{width:22px;height:22px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pagebar{position:sticky;top:0;z-index:4;background:var(--bg);display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:calc(env(safe-area-inset-top) + 4px) 8px 6px}
.pagebar h1{font-size:17px;font-weight:600;text-align:center;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:14px;padding:16px;margin:0 12px}
.card.flush{padding:0}
.card h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
.balance{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.label{font-size:13px;color:var(--muted);font-weight:500}
.chg{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.ranges{display:flex;gap:4px;justify-content:space-between}
.ranges button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 0;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;min-height:32px}
.ranges button.on{background:var(--soft);color:var(--ink)}
.chart svg{width:100%;height:auto;display:block}
.list > .li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer;background:transparent;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.list > .li:first-child{border-top:0}
.list > .li:hover{background:var(--soft)}
.li .t1{font-weight:600}
.li .t2{font-size:13px;color:var(--muted)}
.li .r{text-align:right;white-space:nowrap}
.chev{color:var(--muted);flex:none}
.sectionhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
.sectionhead h2{font-size:17px;margin:0}
.link{border:0;background:transparent;color:var(--link);font-weight:600;cursor:pointer;padding:6px 0;font-size:15px}
.btn{border:0;background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:12px 18px;font-weight:600;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.buy{background:var(--up);color:#fff}
.btn.sell{background:var(--down);color:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;min-height:38px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.tabsline{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabsline button{border:0;background:transparent;padding:10px 0;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabsline button.on{color:var(--ink);border-bottom-color:var(--ink)}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;min-height:46px}
.field:focus{outline:2px solid var(--link);outline-offset:-1px}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea.field{min-height:64px;resize:vertical}
.tk{display:flex;flex-direction:column}
.tk .fr{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line)}
.tk .fr:first-child{border-top:0}
.tk .fr > label{font-size:14px;color:var(--muted);font-weight:500}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid var(--line);font-size:15px}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.kv.total span{font-weight:700;color:var(--ink)}
.alert{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--warn-bg);color:var(--warn)}
.alert.err{background:var(--down-bg);color:var(--down)}
.alert.ok{background:var(--up-bg);color:var(--up)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;min-height:36px}
.chip:hover{border-color:var(--ink)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--muted)}
.pill.open{background:var(--warn-bg);color:var(--warn)}
.pill.filled{background:var(--up-bg);color:var(--up)}
.pill.bad{background:var(--down-bg);color:var(--down)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.open .dot{background:var(--up)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(env(safe-area-inset-bottom) + 4px);z-index:6}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;min-height:50px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--ink)}
.stickybottom{position:sticky;bottom:0;background:var(--bg);padding:12px 12px calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:10px;z-index:3}
.hero{padding:4px 16px 10px}
.qprice{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.grid2 .kv:nth-child(2){border-top:0}
.check{width:64px;height:64px;border-radius:32px;background:var(--up-bg);color:var(--up);display:flex;align-items:center;justify-content:center;margin:12px auto 0}
.check svg{width:34px;height:34px}
.updbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:15;max-width:576px;margin:0 auto;background:var(--btn);color:var(--btn-ink);border-radius:14px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.updbar span{flex:1;font-weight:600;font-size:14px}
.updbar button{border:0;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;background:var(--btn-ink);color:var(--btn)}
.updbar button.x{background:transparent;color:var(--btn-ink);padding:8px 10px}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-right:4px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.reason{font-size:14px;border-left:3px solid var(--line);padding-left:10px}
.skel{height:14px;border-radius:7px;background:var(--line)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
.modal{background:var(--surface);border-radius:18px;padding:18px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;margin-bottom:env(safe-area-inset-bottom)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;font-weight:700;cursor:pointer;min-height:48px;font-variant-numeric:tabular-nums}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:14px 16px}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="app" id="app"><div class="card stack" style="margin-top:60px"><div class="skel" style="width:40%"></div><div class="skel" style="width:70%;height:30px"></div><div class="skel" style="width:55%"></div></div></div>
<nav class="tabs" id="tabs" aria-label="Main"></nav>
<div id="modal"></div>
<div id="upd"></div>
<script>
(function(){
"use strict";
/* ================= constants ================= */
const VERSION = "1.0.0";
const BENCH = "VOO", LS_KEY = "paperstack.gh.v1", CRYPTO_FEE = 0.01;
const FH = "https://finnhub.io/api/v1", CGAPI = "https://api.coingecko.com/api/v3";
const ACCTS = {
  brokerage: {id:"brokerage", name:"Individual", sub:"Brokerage · Practice", num:"…4193"},
  crypto:    {id:"crypto",    name:"Crypto",     sub:"Crypto · Practice",    num:"…7720"}
};
const COINS = [{id:"bitcoin", sym:"BTC", name:"Bitcoin"}, {id:"ethereum", sym:"ETH", name:"Ethereum"}, {id:"litecoin", sym:"LTC", name:"Litecoin"}, {id:"solana", sym:"SOL", name:"Solana"}];
const OT_LABEL = {market:"Market", limit:"Limit", stop:"Stop loss", stoplimit:"Stop limit"};
const TIF_LABEL = {day:"Day", gtc:"Good 'til canceled"};

/* ================= state ================= */
const S = {
  account:null, trades:[], orders:[], history:{points:[]}, prices:{quotes:{}, charts:{}},
  settings:{fhKey:"", avKey:"", lastBackup:0},
  ready:false, startedUp:false, saveErr:"",
  tab:"home", stack:[], range:"1M",
  refreshing:false, flash:"", flashKind:"", live:false, update:null,
  tk:null, lastOrderId:null,
  look:{q:"", busy:false, err:"", results:null},
  xfer:{from:"brokerage", amt:"", err:""},
  rec:{kind:"stock", sym:"", amt:"50", freq:"weekly", busy:false, err:""},
  setupAmt:100000, setupBusy:false, resetting:false, modal:null
};

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const round = (n, d) => { const f = Math.pow(10, d); return Math.round(n * f) / f; };
const USD = new Intl.NumberFormat("en-US", {style:"currency", currency:"USD"});
const money = n => (n == null || isNaN(n)) ? "—" : USD.format(n);
const px = n => (n == null || isNaN(n)) ? "—" : Math.abs(n) < 1 ? "$" + (+n).toPrecision(4) : USD.format(n);
const sMoney = n => (n == null || isNaN(n)) ? "—" : (n >= 0 ? "+" : "−") + USD.format(Math.abs(n));
const pct = n => (n == null || isNaN(n) || !isFinite(n)) ? "—" : (n >= 0 ? "+" : "−") + Math.abs(n).toFixed(2) + "%";
const qf = q => (+q).toLocaleString("en-US", {maximumFractionDigits: 6});
const cls = n => n > 0.000001 ? "up" : n < -0.000001 ? "down" : "";
const num = v => { const n = parseFloat(String(v == null ? "" : v).replace(/[$,\s]/g, "")); return isNaN(n) ? 0 : n; };
const err = (code, message) => ({code, message});
const acctOf = key => key && key.startsWith("C:") ? "crypto" : "brokerage";
const orderNo = id => "P" + String(id).slice(-7).toUpperCase();
const when = ts => new Date(ts).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
const CHEV = '<svg class="chev" width="8" height="14" viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ================= market clock (ET; holidays not modeled) ================= */
const etFmt = new Intl.DateTimeFormat("en-US", {timeZone:"America/New_York", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", weekday:"short", hour12:false});
function et(d){ const o = {}; etFmt.formatToParts(d || new Date()).forEach(p => o[p.type] = p.value); return {date:`${o.year}-${o.month}-${o.day}`, mins:((+o.hour) % 24) * 60 + (+o.minute), wd:o.weekday}; }
const isWeekday = wd => !["Sat","Sun"].includes(wd);
function marketOpen(d){ const p = et(d); return isWeekday(p.wd) && p.mins >= 570 && p.mins < 960; }
function shiftDate(iso, n){ const [y,m,d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m-1, d + n)).toISOString().slice(0,10); }
function dowOf(iso){ const [y,m,d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)).getUTCDay(); }
function sessionId(d){ const p = et(d); let day = p.date; if (!(isWeekday(p.wd) && p.mins >= 960)) day = shiftDate(day, -1); while ([0,6].includes(dowOf(day))) day = shiftDate(day, -1); return day; }
function nextSessionDay(){ const p = et(); if (isWeekday(p.wd) && p.mins < 960) return p.date; let d = shiftDate(p.date, 1); while ([0,6].includes(dowOf(d))) d = shiftDate(d, 1); return d; }
const today = () => et().date;

/* ================= persistence (on this device) ================= */
let saveTimer = null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({account:S.account, trades:S.trades, orders:S.orders, history:S.history, prices:S.prices, settings:S.settings}));
      if (S.saveErr) { S.saveErr = ""; render(); }
    } catch(e) { S.saveErr = "Your phone's storage for this app is full. Make a backup, then Start over."; render(); }
  }, 150);
}
const saveDoc = () => { persist(); return Promise.resolve(); };
const saveItem = () => { persist(); return Promise.resolve(); };
const deleteItem = () => Promise.resolve();
function loadLocal(){
  try { const d = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (d) { S.account = d.account || null; S.trades = d.trades || []; S.orders = d.orders || []; S.history = d.history || {points:[]};
      S.prices = d.prices || S.prices; S.prices.quotes = S.prices.quotes || {}; S.prices.charts = S.prices.charts || {}; S.settings = Object.assign(S.settings, d.settings || {}); } } catch(e) {}
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
}
function backupJSON(){ return JSON.stringify({app:"paperstack", version:VERSION, savedAt:new Date().toISOString(), account:S.account, trades:S.trades, orders:S.orders, history:S.history, settings:{lastBackup:S.settings.lastBackup}}); }
async function doBackup(){
  const name = `paperstack-backup-${today()}.json`, blob = new Blob([backupJSON()], {type:"application/json"});
  try {
    const file = new File([blob], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:"Paperstack backup"}); }
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
    S.settings.lastBackup = Date.now(); persist(); S.flash = "Backup saved. Pick iCloud Drive in Save to Files to keep it safe."; S.flashKind = "ok";
  } catch(e) { if (e && e.name === "AbortError") return; S.flash = "The backup didn't save. Try again."; S.flashKind = "warn"; }
  render();
}
async function restoreFrom(file){
  try { const d = JSON.parse(await file.text());
    if (!d || d.app !== "paperstack" || !d.account) throw 0;
    S.account = d.account; S.trades = d.trades || []; S.orders = d.orders || []; S.history = d.history || {points:[]};
    persist(); S.stack = []; S.tab = "home"; S.flash = "Backup restored."; S.flashKind = "ok"; render(); refreshPrices(true);
  } catch(e) { S.flash = "That file isn't a Paperstack backup."; S.flashKind = "warn"; render(); }
}

/* ================= prices: Finnhub (stocks, real time) + CoinGecko (crypto) ================= */
function priceMsg(e){
  switch (e && e.code) {
    case "nokey": return "Add your free Finnhub key in Settings to get stock prices.";
    case "badkey": return "Finnhub didn't accept your key. Check it in Settings.";
    case "rate": return "Too many price requests in the last minute. Prices will catch up shortly.";
    case "offline": return "Can't reach the price service. Check your connection.";
    default: return (e && e.message) || "Prices couldn't be updated. Try again.";
  }
}
let fhLast = 0, fhChain = Promise.resolve();
function fhGet(path, params){
  const run = async () => {
    if (!S.settings.fhKey) throw err("nokey", "");
    const wait = fhLast + 260 - Date.now(); if (wait > 0) await sleep(wait); fhLast = Date.now();
    const qs = new URLSearchParams(Object.assign({}, params, {token:S.settings.fhKey}));
    let r; try { r = await fetch(`${FH}${path}?${qs}`, {cache:"no-store"}); } catch(e) { throw err("offline", ""); }
    if (r.status === 401 || r.status === 403) throw err("badkey", "");
    if (r.status === 429) throw err("rate", "");
    if (!r.ok) throw err("bad", "Finnhub had a problem (" + r.status + ").");
    return r.json();
  };
  const p = fhChain.then(run, run); fhChain = p.catch(() => {}); return p;
}
async function fetchStock(sym){
  sym = sym.trim().toUpperCase().replace(/[^A-Z0-9.\-]/g, "");
  if (!sym) throw err("notfound", "Enter a ticker symbol.");
  const d = await fhGet("/quote", {symbol:sym});
  if (!d || (!d.c && !d.pc)) throw err("notfound", `No U.S. stock or ETF found for "${sym}". Check the symbol, or search by company name.`);
  const key = "S:" + sym, old = S.prices.quotes[key] || {}, now = Date.now(), open = marketOpen();

  const ys = []; series.forEach(s => (s || []).forEach(p => p.y != null && ys.push(p.y)));
  let lo = Math.min(...ys), hi = Math.max(...ys); const pad = Math.max((hi - lo) * 0.1, Math.abs(hi) * 0.002, 0.0001); lo -= pad; hi += pad;
  const X = x => L + (W - L - R) * (x1 === x0 ? 1 : (x - x0) / (x1 - x0)), Y = y => T + (H - T - B) * (1 - (y - lo) / (hi - lo));
  const path = s => s.filter(p => p.y != null).map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
  const up = main[main.length - 1].y >= main[0].y, col = up ? "var(--up)" : "var(--down)";
  const last = main[main.length - 1];
  const base = opts.baseline != null ? `<line x1="${L}" x2="${W - R}" y1="${Y(opts.baseline).toFixed(1)}" y2="${Y(opts.baseline).toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 4" opacity=".7"/>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Price chart")}">
    <defs><linearGradient id="gf${opts.id || ""}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".18"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${base}
    <path d="${path(main)} L${X(last.x).toFixed(1)} ${H - B} L${X(main[0].x).toFixed(1)} ${H - B} Z" fill="url(#gf${opts.id || ""})"/>
    ${series[1] && series[1].filter(p => p.y != null).length > 1 ? `<path d="${path(series[1])}" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4"/>` : ""}
    <path d="${path(main)}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last.x).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="4" fill="${col}" stroke="var(--surface)" stroke-width="2"/>
    ${opts.axis ? `<text x="${L}" y="${H - 5}" font-size="12" fill="var(--muted)">${esc(opts.axis[0])}</text><text x="${W - R}" y="${H - 5}" font-size="12" fill="var(--muted)" text-anchor="end">${esc(opts.axis[1])}</text>` : ""}
  </svg>`;
}
function historyChart(){
  const pts = S.history.points || [], now = Date.now();
  const span = {"1W":7, "1M":30, "3M":91, "1Y":365}[S.range];
  let from = span ? now - span * 864e5 : 0;
  if (S.range === "YTD") from = new Date(new Date().getFullYear(), 0, 1).getTime();
  let sel = pts.filter(p => p.t >= from);
  const prior = pts.filter(p => p.t < from).pop(); if (prior) sel = [prior].concat(sel);
  const d = t => new Date(t).toLocaleDateString("en-US", {month:"short", day:"numeric"});
  return lineChart([sel.map(p => ({x:p.t, y:p.v})), sel.map(p => ({x:p.t, y:p.b}))], {id:"h", label:"Balance over time with the same money in VOO", axis:sel.length > 1 ? [d(sel[0].t), d(sel[sel.length - 1].t)] : null, empty:"Your balance chart fills in as prices update over the next few days."});
}

    <div class="stack"><div class="check">${filled ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>'}</div>
      <p style="text-align:center;margin:0" class="px">${filled ? `${o.action === "buy" ? "Bought" : "Sold"} <b>${qf(o.fillQty)} ${esc(o.symbol)}</b> at <b>${px(o.fillPrice)}</b> for ${money(o.fillTotal)}.` : `Your ${OT_LABEL[o.orderType].toLowerCase()} order to ${o.action} ${esc(o.symbol)} is open. ${o.kind === "stock" && o.goodFor > today() ? "It will be checked when the market opens on " + esc(o.goodFor) + "." : "It fills when the price condition is met."}`}</p>
      <section class="card flush"><div class="kv"><span>Order number</span><span>${orderNo(o.id)}</span></div><div class="kv"><span>Status</span><span>${filled ? "Filled" : "Open"}</span></div><div class="kv"><span>Account</span><span>${ACCTS[o.acct].name} ${ACCTS[o.acct].num}</span></div></section></div>
    <div class="stickybottom"><button type="button" class="btn sec block" data-act="viewOrders">View orders</button><button type="button" class="btn block" data-act="done">Done</button></div>`;
}
function transferPage(){
  const c = compute(), x = S.xfer, to = x.from === "brokerage" ? "crypto" : "brokerage";
  return pageBar("Transfer") + `<div class="stack" style="margin-top:6px"><section class="card flush tk">
    <div class="fr"><label for="xFrom">From</label><select class="field" id="xFrom">${["brokerage","crypto"].map(id => `<option value="${id}" ${x.from === id ? "selected" : ""}>${ACCTS[id].name} · ${money(c.accts[id].avail)} available</option>`).join("")}</select></div>
    <div class="fr"><span class="label" style="font-size:14px">To</span><b>${ACCTS[to].name} ${ACCTS[to].num}</b></div>
    <div class="fr"><label for="xAmt">Amount</label><input class="field num" id="xAmt" inputmode="decimal" placeholder="$0.00" value="${esc(x.amt)}"></div></section>
    ${x.err ? `<div class="px"><div class="alert err">${esc(x.err)}</div></div>` : ""}
    <div class="px"><button type="button" class="btn block" data-act="doTransfer">Transfer now</button></div>
    <p class="tiny muted px" style="margin:0">Moving cash into the Crypto account is how you fund crypto buys, the same way a broker's crypto account draws from your brokerage account.</p></div>`;
}
function recurringPage(){
  const r = S.rec, list = S.account.recurring || [];
  return pageBar("Automatic investments") + `<div class="stack" style="margin-top:6px">
    <section class="card flush"><div class="list">${list.map(p => `<div class="li" style="cursor:default"><div><div class="t1">${esc(p.symbol)} · ${money(p.amount)}</div><div class="t2">${p.freq === "biweekly" ? "Every 2 weeks" : esc(p.freq[0].toUpperCase() + p.freq.slice(1))} · next ${esc(p.next)}${p.note ? " · " + esc(p.note) : ""}</div></div><button type="button" class="link" data-act="recDel" data-id="${esc(p.id)}">Remove</button></div>`).join("") || `<p class="muted small px" style="padding:14px 16px">No automatic investments yet.</p>`}</div></section>
    <section class="card stack"><h2>New automatic investment</h2>
      <div class="seg"><button type="button" class="${r.kind === "stock" ? "on" : ""}" data-act="recKind" data-v="stock">Stock / ETF</button><button type="button" class="${r.kind === "crypto" ? "on" : ""}" data-act="recKind" data-v="crypto">Crypto</button></div>
      ${r.kind === "stock" ? `<div><label class="label" for="recSym">Symbol</label><input class="field" id="recSym" placeholder="e.g. VOO" value="${esc(r.sym)}" autocapitalize="characters"></div>`
        : `<div><label class="label" for="recCoin">Coin</label><select class="field" id="recCoin">${COINS.map(x => `<option value="${x.id}" ${r.sym === x.id ? "selected" : ""}>${x.sym} · ${x.name}</option>`).join("")}</select></div>`}
      <div class="row" style="gap:8px"><div style="flex:1"><label class="label" for="recAmt">Amount</label><input class="field num" id="recAmt" inputmode="decimal" value="${esc(r.amt)}"></div>
        <div style="flex:1"><label class="label" for="recFreq">Frequency</label><select class="field" id="recFreq">${["weekly","biweekly","monthly"].map(f => `<option value="${f}" ${r.freq === f ? "selected" : ""}>${f === "biweekly" ? "Every 2 weeks" : f[0].toUpperCase() + f.slice(1)}</option>`).join("")}</select></div></div>
      ${r.err ? `<div class="alert err">${esc(r.err)}</div>` : ""}
      <button type="button" class="btn block" data-act="recSave" ${r.busy ? "disabled" : ""}>${r.busy ? "Checking price…" : "Start · first buy today"}</button>
      <p class="tiny muted" style="margin:0">Each one places a dollar-based market order on schedule, the next time you open the app. Crypto plans draw from the Crypto account's cash.</p></section></div>`;
}
function settingsPage(){
  const lb = S.settings.lastBackup ? new Date(S.settings.lastBackup).toLocaleDateString() : "never";
  return pageBar("Settings") + `<div class="stack" style="margin-top:6px">
    <section class="card stack"><h2>Price data</h2>
      <div><label class="label" for="setFh">Finnhub API key (live stock prices)</label><input class="field" id="setFh" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(S.settings.fhKey)}" placeholder="Paste your key"></div>
      <div><label class="label" for="setAv">Alpha Vantage API key (optional, stock charts)</label><input class="field" id="setAv" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(S.settings.avKey)}" placeholder="Optional"></div>
      <button type="button" class="btn block" data-act="saveKeys">Save keys</button>
      <p class="tiny muted" style="margin:0">Keys are saved only on this phone. Get them free at finnhub.io and alphavantage.co. Crypto prices need no key.</p></section>
    <section class="card stack"><h2>Backup</h2>
      <p class="small muted" style="margin:0">Your portfolio is saved on this phone. Back it up to iCloud Drive so you never lose it. Last backup: ${esc(lb)}.</p>
      <div class="row" style="gap:8px"><button type="button" class="btn block" data-act="backup">Back up now</button><button type="button" class="btn sec block" data-act="restore">Restore</button></div>
      <input type="file" id="restoreFile" accept="application/json,.json" class="sr"></section>
    <section class="card flush"><div class="list"><button type="button" class="li" data-act="reset"><div><div class="t1 down">Start over</div><div class="t2">Erase everything and pick new practice cash</div></div>${CHEV}</button></div></section>
    <p class="foot">Paperstack v${VERSION}</p></div>`;
}
function backupDue(){ return S.account && S.trades.length > 0 && Date.now() - (S.settings.lastBackup || S.account.createdAt) > 30 * 864e5; }
function setupView(){
  const opts = [1000, 10000, 25000, 100000];
  return `<div class="topbar"><div class="brandline"><b>Paperstack</b> · Practice money</div></div><div class="px"><div class="bigtitle">${S.resetting ? "Start over" : "Welcome"}</div></div>
  <section class="card stack"><p class="muted" style="margin:0">Pick your practice cash. It goes into your Individual brokerage account; move some to the Crypto account if you want to trade coins. ${S.resetting ? "<b>Your current orders, fills and journal will be erased.</b>" : ""}</p>
    <div class="opts">${opts.map(o => `<button type="button" class="opt ${S.setupAmt === o ? "on" : ""}" data-act="setupAmt" data-v="${o}" aria-pressed="${S.setupAmt === o}">${money(o).replace(".00","")}</button>`).join("")}</div>
    <div><label class="label" for="setupCustom">Or type an amount</label><input class="field num" id="setupCustom" inputmode="decimal" placeholder="e.g. 5000"></div>
    ${S.resetting ? "" : `<div><label class="label" for="setupKey">Finnhub API key (free at finnhub.io, for live stock prices)</label><input class="field" id="setupKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your key" value="${esc(S.settings.fhKey)}"></div>`}
    <div class="row" style="gap:8px">${S.resetting ? `<button type="button" class="btn sec block" data-act="cancelReset">Cancel</button>` : ""}<button type="button" class="btn block" data-act="start" ${S.setupBusy ? "disabled" : ""}>${S.setupBusy ? "Setting up…" : "Open practice account"}</button></div></section>`;
}
function renderModal(){
  const m = S.modal;
  $("#modal").innerHTML = !m ? "" : `<div class="modal-back" data-act="modalClose"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" data-stop="1"><h2 id="mt" style="margin:0">${esc(m.title)}</h2><p class="muted" style="margin:0">${esc(m.body)}</p>
    <div class="row" style="gap:8px"><button type="button" class="btn sec block" data-act="modalClose">Cancel</button><button type="button" class="btn ${m.danger ? "sell" : ""} block" data-act="modalOk">${esc(m.ok)}</button></div></div></div>`;
}

/* ================= actions ================= */
async function openQuote(key){
  const pg = {type:"quote", key, err:""}; go(pg);
  try { await quoteFor(key, false); persist(); } catch(e) { pg.err = priceMsg(e); }
  if (top_() === pg) render();
}
async function tkLoad(key){
  const t = S.tk; t.busy = true; t.err = ""; render();
  try { const q = await quoteFor(key, false); t.key = q.key; t.symbol = q.symbol; t.name = q.name; t.kind = q.kind; t.symIn = q.symbol; persist(); }
  catch(e) { t.err = priceMsg(e); t.key = null; }
  t.busy = false; render();
}
const A = {
  tab(el){ S.tab = el.dataset.tab; S.flash = ""; render(); window.scrollTo(0, 0); },
  back(){ back(); },
  refresh(){ S.flash = ""; refreshPrices(true); },
  range(el){ S.range = el.dataset.v; render(); },
  account(el){ go({type:"account", id:el.dataset.id, tab:"summary"}); },
  acctTab(el){ top_().tab = el.dataset.v; render(); },
  quote(el){ openQuote(el.dataset.key); },
  lookSym(el){ openQuote("S:" + el.dataset.sym.toUpperCase()); },
  watch(el){ const k = el.dataset.key, w = S.account.watchlist || (S.account.watchlist = []); const i = w.indexOf(k); if (i >= 0) w.splice(i, 1); else w.push(k); persist(); render(); },
  unwatch(el){ S.account.watchlist = (S.account.watchlist || []).filter(k => k !== el.dataset.key); persist(); render(); },
  async loadChart(el){ const pg = top_(); el.disabled = true; el.textContent = "Loading…"; try { await fetchChart(el.dataset.sym); } catch(e) { pg.err = priceMsg(e); } render(); },
  trade(el){ openTicket({}); if (el.dataset.acct) { S.tk.acct = el.dataset.acct; S.tk.kind = el.dataset.acct === "crypto" ? "crypto" : "stock"; render(); } },
  tradeKey(el){ openTicket({key:el.dataset.key, action:el.dataset.side}); },
  transfer(){ S.xfer = {from:"brokerage", amt:"", err:""}; go({type:"transfer"}); },
  orders(){ go({type:"orders"}); },
  recurring(){ S.rec.err = ""; go({type:"recurring"}); },
  viewOrders(){ S.stack = [{type:"orders"}]; render(); },
  done(){ S.stack = []; S.tab = "home"; render(); window.scrollTo(0, 0); },
  cancelOrder(el){ const id = el.dataset.id; S.modal = {title:"Cancel this order?", body:"It will be removed from your open orders.", ok:"Cancel order", danger:true, run(){ cancelOrder(id); }}; render(); },
  tkSet(el){ const t = S.tk; const f = el.dataset.f, v = el.dataset.v; t[f] = v; t.err = "";
    if (f === "qtyType" && v === "dollars" && t.kind === "stock") { t.orderType = "market"; t.tif = "day"; }
    if (f === "qtyType" || f === "action") t.qty = ""; render(); },
  tkSellAll(){ const t = S.tk; const p = compute().accts[t.acct].positions.find(x => x.key === t.key); if (!p) return; t.qtyType = "shares"; t.qty = String(round(p.avail, 6)); render(); },
  async preview(){
    const t = S.tk; const o = tkOrder(); t.err = "";
    t.busy = true; render();
    let q = S.prices.quotes[o.key];
    try { q = await quoteFor(o.key, o.orderType === "market"); persist(); } catch(e) { if (!q) { t.err = priceMsg(e); t.busy = false; render(); return; } }
    t.busy = false;
    const v = validateOrder(o, q); if (v) { t.err = v; render(); return; }
    go({type:"preview"});
  },
  async place(){
    const t = S.tk; const o = tkOrder(); const q = S.prices.quotes[o.key];
    const v = validateOrder(o, q); if (v) { t.err = v; render(); return; }
    t.busy = true; render();
    try { const placed = await placeOrder(o); S.lastOrderId = placed.id; t.busy = false; S.stack = [{type:"confirm"}]; render(); window.scrollTo(0, 0); }
    catch(e) { t.busy = false; t.err = "The order couldn't be placed. Try again."; render(); }
  },
  doTransfer(){
    const x = S.xfer, amt = round(num($("#xAmt").value), 2), to = x.from === "brokerage" ? "crypto" : "brokerage";
    x.amt = $("#xAmt").value;
    if (!(amt >= 1)) { x.err = "Enter at least $1.00."; render(); return; }
    if (amt > compute().accts[x.from].avail + 0.005) { x.err = `${ACCTS[x.from].name} only has ${money(compute().accts[x.from].avail)} available.`; render(); return; }
    (S.account.transfers = S.account.transfers || []).push({id:rid(), ts:Date.now(), from:x.from, to, amount:amt});
    persist(); S.stack.pop(); S.flash = `Moved ${money(amt)} to ${ACCTS[to].name}.`; S.flashKind = "ok"; render();
  },
  recKind(el){ S.rec.kind = el.dataset.v; S.rec.sym = el.dataset.v === "crypto" ? "bitcoin" : ""; render(); },
  async recSave(){
    const r = S.rec; r.sym = r.kind === "stock" ? $("#recSym").value.trim().toUpperCase() : $("#recCoin").value; r.amt = $("#recAmt").value; r.freq = $("#recFreq").value;
    const amount = round(num(r.amt), 2);
    if (!r.sym) { r.err = "Enter a symbol."; render(); return; }
    if (!(amount >= 1)) { r.err = "Amount must be at least $1."; render(); return; }
    r.busy = true; r.err = ""; render();
    try { const q = await quoteFor(r.kind === "stock" ? "S:" + r.sym : "C:" + r.sym, false);
      (S.account.recurring = S.account.recurring || []).push({id:rid(), key:q.key, kind:q.kind, symbol:q.symbol, name:q.name, amount, freq:r.freq, next:today()});
      await persist(); persist(); r.busy = false; r.sym = ""; render(); runRecurring();
    } catch(e) { r.busy = false; r.err = priceMsg(e); render(); }
  },
  recDel(el){ S.account.recurring = (S.account.recurring || []).filter(x => x.id !== el.dataset.id); persist(); render(); },
  saveLesson(el){ const t = S.trades.find(x => x.id === el.dataset.id), ta = $("#lesson-" + CSS.escape(el.dataset.id)); if (!t || !ta) return; const v = ta.value.trim().slice(0, 800); if (v === (t.lesson || "")) return; t.lesson = v; saveItem("trades", t); el.textContent = "Saved"; },
  setupAmt(el){ S.setupAmt = +el.dataset.v; render(); },
  start(){ const k = $("#setupKey"); if (k) S.settings.fhKey = k.value.trim(); const v = num($("#setupCustom") && $("#setupCustom").value); startAccount(v >= 100 ? Math.min(round(v, 2), 1e7) : S.setupAmt); },
  settings(){ go({type:"settings"}); },
  backup(){ doBackup(); },
  restore(){ const i = $("#restoreFile"); if (i) i.click(); },
  saveKeys(){ S.settings.fhKey = $("#setFh").value.trim(); S.settings.avKey = $("#setAv").value.trim(); persist(); S.flash = "Saved."; S.flashKind = "ok"; S.stack.pop(); render(); if (ws) { try { ws.close(); } catch(e) {} } refreshPrices(true); },
  update(){ location.reload(); },
  snooze(){ S.update = null; updSnoozeUntil = Date.now() + 15 * 60e3; renderUpd(); },
  reset(){ S.modal = {title:"Start over?", body:"This erases your orders, fills, journal notes and chart, then lets you pick new practice cash.", ok:"Erase and start over", danger:true, run(){ S.resetting = true; S.setupAmt = S.account.startCash; render(); }}; render(); },
  cancelReset(){ S.resetting = false; render(); },
  modalClose(el, e){ if (el.classList.contains("modal-back") && e.target.closest("[data-stop]")) return; S.modal = null; render(); },
  modalOk(){ const m = S.modal; S.modal = null; render(); m.run(); }
};
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (!el || el.disabled) return; const fn = A[el.dataset.act]; if (fn) fn(el, e); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.modal) { S.modal = null; render(); } });
document.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target.dataset.form;
  if (f === "tkSym") { const v = $("#tkSym").value.trim().toUpperCase(); S.tk.symIn = v; if (v) tkLoad("S:" + v.replace(/[^A-Z0-9.\-]/g, "")); }
  if (f === "look") {
    const v = $("#lookIn").value.trim(); const L = S.look; L.q = v; L.err = ""; L.results = null; if (!v) return;
    const coin = COINS.find(c => c.sym.toLowerCase() === v.toLowerCase() || c.name.toLowerCase() === v.toLowerCase() || c.id === v.toLowerCase());
    if (coin) { openQuote("C:" + coin.id); return; }
    if (/^[A-Za-z.\-]{1,4}$/.test(v) || /^[A-Z.\-]{1,6}$/.test(v)) { openQuote("S:" + v.toUpperCase()); return; }
    L.busy = true; render();
    try { L.results = await searchStocks(v); } catch(x) { L.err = priceMsg(x); }
    L.busy = false; render();
  }
});
document.addEventListener("input", e => {
  const id = e.target.id, v = e.target.value, t = S.tk;
  if (id === "tkQty" && t) { t.qty = v; afterRender(); }
  else if (id === "tkLimit" && t) { t.limit = v; afterRender(); }
  else if (id === "tkStop" && t) { t.stop = v; afterRender(); }
  else if (id === "tkNote" && t) t.note = v;
  else if (id === "tkSym" && t) t.symIn = v;
  else if (id === "lookIn") S.look.q = v;
  else if (id === "xAmt") S.xfer.amt = v;
});
document.addEventListener("change", e => {
  const id = e.target.id, v = e.target.value, t = S.tk;
  if (id === "tkAcct" && t) { t.acct = v; t.kind = v === "crypto" ? "crypto" : "stock"; t.key = null; t.symbol = ""; t.symIn = ""; t.orderType = "market"; t.qtyType = "shares"; t.qty = ""; t.err = ""; render(); }
  else if (id === "tkCoin" && t) { if (v) tkLoad(v); }
  else if (id === "tkType" && t) { t.orderType = v; if (v === "market") t.tif = "day"; if (v !== "market" && t.kind === "stock" && t.qtyType === "dollars") { t.qtyType = "shares"; t.qty = ""; } t.err = ""; render(); }
  else if (id === "tkTif" && t) t.tif = v;
  else if (id === "xFrom") { S.xfer.from = v; render(); }
  else if (id === "restoreFile" && e.target.files && e.target.files[0]) { const f = e.target.files[0]; S.modal = {title:"Restore this backup?", body:"It replaces everything currently in the app with the backup.", ok:"Restore", danger:true, run(){ restoreFrom(f); }}; render(); }
});

/* ================= boot ================= */
let updSnoozeUntil = 0;
function renderUpd(){ const el = $("#upd"); if (!el) return; el.innerHTML = S.update && Date.now() > updSnoozeUntil ? `<div class="updbar" role="status"><span>New version ready</span><button type="button" data-act="update">Update now</button><button type="button" class="x" data-act="snooze" aria-label="Remind me later">✕</button></div>` : ""; }
async function checkUpdate(){
  try { const r = await fetch("version.json?t=" + Date.now(), {cache:"no-store"}); if (!r.ok) return; const v = await r.json();
    if (v && v.version && v.version !== VERSION) { S.update = v.version; renderUpd(); } } catch(e) {}
}
function boot(){
  loadLocal();
  S.ready = true; render();
  if (S.account) { S.startedUp = true; setTimeout(async () => { await refreshPrices(false, null, true); await runRecurring(); }, 200); }
  checkUpdate();
}
/* keep prices and open orders current while the app is open */
let tick = 0;
setInterval(() => {
  tick++;
  if (!S.ready || !S.account || document.hidden || S.refreshing) return;
  const keys = trackedKeys();
  const ck = keys.filter(k => k.startsWith("C:") && !cryptoFresh(S.prices.quotes[k], true));
  const sk = marketOpen() && S.settings.fhKey ? keys.filter(k => k.startsWith("S:") && (!S.live || !wsSubs.has(k.slice(2))) && !stockFresh(S.prices.quotes[k], false)) : [];
  if (ck.length || sk.length) refreshPrices(false, ck.concat(sk), true); else { evaluateOrders(); syncStream(); }
  if (tick % 10 === 0) { checkUpdate(); renderUpd(); }
}, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.account) { checkUpdate(); refreshPrices(false, null, true); } else syncStream(); });
boot();
})();
</script>
